site_name: ikun爱学习
theme:
  name: 
    material  # 核心配置：使用 Material 主题
  palette: #调色板
    - scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/weather-night
        name: 暗色模式
    - scheme: slate
      toggle:
        icon: material/weather-sunny
        name: 亮色模式
  
  language:
    zh #表示在浏览器中显示当前页面的语言是什么，如果是en，那么像谷歌浏览器就可以翻译

  font:
    text: "Noto Sans, Noto Sans SC"  # 优先使用Noto Sans显示符号
    code: "Fira Code, monospace"     # 添加monospace作为回退
  
  features:
    - navigation.tabs       # 启用顶部标签页
    - navigation.indexes    # 显示章节索引
    - content.code.annotate # 启动代码标注
    - content.code.copy     # 启动代码复制

plugins:
  - search

# ---------------------配置数学公式相关内容--------------------------
markdown_extensions:
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.superfences:
      custom_fences:
      - name: mermaid
        class: mermaid
        format: !!python/name:pymdownx.superfences.fence_code_format
extra_javascript:
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-ams.js  # 关键：加载 amsmath 扩展
  - https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js #启动mermaid
# ---------------------end--------------------------
